services:
  valkey:
    image: valkey/valkey:8-alpine
    container_name: searxng-valkey
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    volumes:
      - /data/appdata/searxng/valkey:/data
    networks:
      - internal_net

  searxng:
    image: searxng/searxng
    container_name: searxng
    restart: unless-stopped
    environment:
      - SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-http://localhost:8080/}
      - SEARXNG_SECRET=${SEARXNG_SECRET}
      - SEARXNG_LIMITER=${SEARXNG_LIMITER:-true}
      - SEARXNG_PUBLIC_INSTANCE=${SEARXNG_PUBLIC_INSTANCE:-true}
      - SEARXNG_IMAGE_PROXY=${SEARXNG_IMAGE_PROXY:-true}
      - SEARXNG_VALKEY_URL=${SEARXNG_VALKEY_URL:-valkey://valkey:6379/0}
    volumes:
      - /data/appdata/searxng/config:/etc/searxng
      - /data/appdata/searxng/cache:/var/cache/searxng
    networks:
      - internal_net

networks:
  internal_net:
    external: true
